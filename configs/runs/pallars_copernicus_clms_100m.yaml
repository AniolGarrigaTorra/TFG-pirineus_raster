run:
  name: pallars_copernicus_clms_100m
  description: "Copernicus Land Monitoring Service priority and easy-interest static layers for Pallars Sobirà."
  project_config: configs/project.yaml
  aoi_config: configs/aoi/experimental_pallars_sobira.yaml
  resolution_m: 100
  stages: [download, clip, build]

sources:
  - id: copernicus_clms_forest
    config: configs/sources/copernicus/copernicus_clms_forest.yaml
    stages: [download, clip, build]

  - id: copernicus_clms_grasslands
    config: configs/sources/copernicus/copernicus_clms_grasslands.yaml
    stages: [download, clip, build]

  - id: copernicus_clms_water_wetness
    config: configs/sources/copernicus/copernicus_clms_water_wetness.yaml
    stages: [download, clip, build]

  - id: copernicus_clms_corine_land_cover
    config: configs/sources/copernicus/copernicus_clms_corine_land_cover.yaml
    stages: [download, clip, build]

  - id: copernicus_dem_glo30
    config: configs/sources/copernicus/copernicus_dem_glo30.yaml
    stages: [download, clip, build]

  - id: copernicus_clms_imperviousness
    config: configs/sources/copernicus/copernicus_clms_imperviousness.yaml
    stages: [download, clip, build]

  - id: copernicus_clms_small_landscape_features
    config: configs/sources/copernicus/copernicus_clms_small_landscape_features.yaml
    stages: [download, clip, build]

outputs:
  dataset_dir: data_processed/datasets/pallars_copernicus_clms_100m
  copy_rasters: true
  overwrite_existing: true
  write_run_summary: true
  write_manifest: true