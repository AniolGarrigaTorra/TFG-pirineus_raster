run:
  name: pyrenees_pdca_topoclimate_100m
  description: "Pyrenean Digital Climate Atlas topoclimate surfaces, harmonized to the PDCA-based full Pyrenees AOI at 100 m."
  project_config: configs/project.yaml
  aoi_config: configs/aoi/pyrenees_pdca_full.yaml
  clip_aoi_config: configs/aoi/pyrenees_pdca_full.yaml
  resolution_m: 100
  stages: [download, clip, build]

sources:
  - id: pdca_topoclimate_1950_2012
    config: configs/sources/pdca/pdca_topoclimate_1950_2012.yaml
    stages: [download, clip, build]

outputs:
  dataset_dir: data_processed/datasets/pyrenees_pdca_topoclimate_100m
  copy_rasters: true
  overwrite_existing: true
  write_run_summary: true
  write_manifest: true