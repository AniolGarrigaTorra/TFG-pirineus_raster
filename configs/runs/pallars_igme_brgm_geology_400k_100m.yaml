run:
  name: pallars_igme_brgm_geology_400k_100m
  description: "IGME/BRGM Pyrenees geological and Quaternary maps at 1:400,000 rasterized to the pyrinees project grid."
  project_config: configs/project.yaml
  aoi_config: configs/aoi/pyrenees_full.yaml
  resolution_m: 100
  stages: [all]

sources:
  - id: igme_brgm_pyrenees_geology_400k
    config: configs/sources/igme_brgm/igme_brgm_pyrenees_geology_400k.yaml
    stages: [all]

outputs:
  dataset_dir: data_processed/datasets/pallars_igme_brgm_geology_400k_100m
  copy_rasters: true
  overwrite_existing: true
  write_run_summary: true
  write_manifest: true