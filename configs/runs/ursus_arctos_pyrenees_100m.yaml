run:
  name: ursus_arctos_pyrenees_100m
  description: 'Dataset for the Ursus Arctos habitat project. '
  project_config: configs/project.yaml
  crs: EPSG:3035
  aoi_config: configs/aoi/ursus_arctos_pyrenees.yaml
  resolution_m: 100
  stages:
  - all
features:
- name: topography_dem
  title: Copernicus DEM
  description: Digital Elevation Model of the terrain
  unit: m
  value_semantics: intensive
  output_dtype: float32
  build_type: source_layer
  inputs:
    x:
      kind: source
      source_id: copernicus_dem_glo30
      config: configs/sources/copernicus/copernicus_dem_glo30.yaml
      variable: elevation
      query:
        source_id: copernicus_dem_glo30
        variable: elevation
      dimensions: {}
      temporal:
        output_mode: static
      source_resolution: 30m
      resampling: average
  parameters: {}
  outputs:
  - name: topography_dem_elevation
    suffix: elevation
    unit: m
    value_semantics: intensive
    output_dtype: float32
    inputs:
      x:
        kind: source
        source_id: copernicus_dem_glo30
        config: configs/sources/copernicus/copernicus_dem_glo30.yaml
        variable: elevation
        query:
          source_id: copernicus_dem_glo30
          variable: elevation
        dimensions: {}
        temporal:
          output_mode: static
        source_resolution: 30m
        resampling: average
    parameters: {}
- name: topography_slope
  title: Copernicus DEM - Slope
  description: 'Slope derived from copernicus DEM '
  value_semantics: intensive
  output_dtype: float32
  build_type: spatial
  inputs:
    dem:
      kind: source
      source_id: copernicus_dem_glo30
      config: configs/sources/copernicus/copernicus_dem_glo30.yaml
      variable: elevation
      query:
        source_id: copernicus_dem_glo30
        variable: elevation
      dimensions: {}
      temporal:
        output_mode: static
      source_resolution: 30m
      resampling: average
  operation: terrain
  method: slope
  parameters: {}
  evaluation_stage: native_then_resample
  evaluation_resolution_m: native
  post_resampling: average
  outputs:
  - name: topography_slope
    suffix: ''
    value_semantics: intensive
    output_dtype: float32
    inputs:
      dem:
        kind: source
        source_id: copernicus_dem_glo30
        config: configs/sources/copernicus/copernicus_dem_glo30.yaml
        variable: elevation
        query:
          source_id: copernicus_dem_glo30
          variable: elevation
        dimensions: {}
        temporal:
          output_mode: static
        source_resolution: 30m
        resampling: average
    operation: terrain
    method: slope
    parameters: {}
    evaluation_stage: native_then_resample
    evaluation_resolution_m: native
    post_resampling: average
