- name: habitat_biomass
  title: Vegetal Biomass
  description: Total biomass in an ha.
  value_semantics: intensive
  output_dtype: float32
  build_type: source_layer
  inputs:
    x:
      kind: source
      source_id: esa_cci_biomass_agb_100m
      config: configs/sources/esa_cci/esa_cci_biomass_agb_100m.yaml
      variable: agb
      query:
        source_id: esa_cci_biomass_agb_100m
        variable: agb
        aggregation_name: mean
      dimensions: {}
      temporal:
        output_mode: aggregate
        aggregations:
          use: []
          custom:
          - name: mean
            form: year_range_metric
            metric: mean
            years:
            - 2005
            - 2024
            variables:
            - agb
      source_resolution: 100m
      resampling: average
  parameters: {}
  outputs:
  - name: habitat_biomass_mean
    suffix: mean
    value_semantics: intensive
    output_dtype: float32
    inputs:
      x:
        kind: source
        source_id: esa_cci_biomass_agb_100m
        config: configs/sources/esa_cci/esa_cci_biomass_agb_100m.yaml
        variable: agb
        query:
          source_id: esa_cci_biomass_agb_100m
          variable: agb
          aggregation_name: mean
        dimensions: {}
        temporal:
          output_mode: aggregate
          aggregations:
            use: []
            custom:
            - name: mean
              form: year_range_metric
              metric: mean
              years:
              - 2005
              - 2024
              variables:
              - agb
        source_resolution: 100m
        resampling: average
    parameters: {}
- name: habitat_broadleaf
  title: Broadleaved forest coverage ratio
  description: Coverage percentage of broadleaved forest in the 100m cell. Derived
    from Copernicus CLMS forest dominant_leaf_type.
  value_semantics: fraction
  output_dtype: float32
  build_type: source_layer
  inputs:
    x:
      kind: source
      source_id: copernicus_clms_forest
      config: configs/sources/copernicus/copernicus_clms_forest.yaml
      variable: dominant_leaf_type
      query:
        source_id: copernicus_clms_forest
        variable: dominant_leaf_type_broadleaved_forest_fraction
      dimensions: {}
      temporal:
        output_mode: static
      category_fraction:
        variable: dominant_leaf_type
        name: dominant_leaf_type_broadleaved_forest_fraction
        class_values:
        - 1
        label: Broadleaved forest
        resampling: average
      source_resolution: 10m
      resampling: average
  parameters: {}
  outputs:
  - name: habitat_broadleaf
    suffix: ''
    value_semantics: fraction
    output_dtype: float32
    inputs:
      x:
        kind: source
        source_id: copernicus_clms_forest
        config: configs/sources/copernicus/copernicus_clms_forest.yaml
        variable: dominant_leaf_type
        query:
          source_id: copernicus_clms_forest
          variable: dominant_leaf_type_broadleaved_forest_fraction
        dimensions: {}
        temporal:
          output_mode: static
        category_fraction:
          variable: dominant_leaf_type
          name: dominant_leaf_type_broadleaved_forest_fraction
          class_values:
          - 1
          label: Broadleaved forest
          resampling: average
        source_resolution: 10m
        resampling: average
    parameters: {}
- name: habitat_coniferous
  title: Coniferous forest coverage ratio
  description: Coverage ratio of coniferous forest in the cell. Derived from Copernicus
