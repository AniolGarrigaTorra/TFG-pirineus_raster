- name: human_population_density
  title: Population Density
  description: Population density derived from GHSL
  value_semantics: count
  output_dtype: float32
  build_type: source_layer
  inputs:
    x:
      kind: source
      source_id: ghsl_ghs_pop_r2023a
      config: configs/sources/ghsl/ghsl_ghs_pop_r2023a.yaml
      variable: population_count
      query:
        source_id: ghsl_ghs_pop_r2023a
        variable: population_count
        aggregation_name: mean
      dimensions: {}
      temporal:
        output_mode: aggregate
        aggregations:
          use: []
          custom:
          - name: mean
            form: year_range_metric
            metric: mean
            years:
            - 1995
            - 2025
            variables:
            - population_count
      source_resolution: 100m
      resampling: bilinear
  parameters: {}
  outputs:
