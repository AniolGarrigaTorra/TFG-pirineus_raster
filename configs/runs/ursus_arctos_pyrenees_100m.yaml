        variable: dominant_leaf_type
        name: dominant_leaf_type_coniferous_forest_fraction
        class_values:
        - 2
        label: Coniferous forest
        resampling: average
      source_resolution: 10m
      resampling: average
  parameters: {}
  outputs:
  - name: habitat_coniferous_dominant_leaf_type
    suffix: dominant_leaf_type
    value_semantics: intensive
    output_dtype: float32
    inputs:
      x:
        kind: source
        source_id: copernicus_clms_forest
        config: configs/sources/copernicus/copernicus_clms_forest.yaml
        variable: dominant_leaf_type
        query:
          source_id: copernicus_clms_forest
          variable: dominant_leaf_type_coniferous_forest_fraction
        dimensions: {}
        temporal:
          output_mode: static
        category_fraction:
          variable: dominant_leaf_type
          name: dominant_leaf_type_coniferous_forest_fraction
          class_values:
          - 2
          label: Coniferous forest
          resampling: average
        source_resolution: 10m
        resampling: average
    parameters: {}
- name: habitat_mix_forest
  title: Mix forest coverage ratio
  description: Coverage ratio for mix forests. Derived from habitat_broadleaf and
    habitat_coniferous derived features
  value_semantics: intensive
  output_dtype: float32
  build_type: expression
  inputs:
    x:
      kind: feature
      feature: habitat_broadleaf
      output: habitat_broadleaf
    y:
      kind: feature
      feature: habitat_coniferous_dominant_leaf_type
      output: habitat_coniferous_dominant_leaf_type
  expression: clip(2*minimum(x,y),0,1)
  parameters: {}
  evaluation_stage: target_grid
  outputs:
  - name: habitat_mix_forest_habitat_broadleaf_habitat_coniferous_dominant_leaf_type
    suffix: habitat_broadleaf_habitat_coniferous_dominant_leaf_type
    value_semantics: intensive
    output_dtype: float32
    inputs:
      x:
        kind: feature
        feature: habitat_broadleaf
        output: habitat_broadleaf
      y:
        kind: feature
        feature: habitat_coniferous_dominant_leaf_type
        output: habitat_coniferous_dominant_leaf_type
    expression: clip(2*minimum(x,y),0,1)
    parameters: {}
    evaluation_stage: target_grid
