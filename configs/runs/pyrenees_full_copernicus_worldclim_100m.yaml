run:
  name: pyrenees_full_copernicus_worldclim_100m
  description: "Full Pyrenees 100 m dataset combining Copernicus land-cover/topography layers and selected WorldClim climate, bioclimatic and derived features."
  project_config: configs/project.yaml

  # Global output AOI for all sources
  aoi_config: configs/aoi/pyrenees_full.yaml

  # Optional. If omitted, each source keeps its own clip_aoi_config.
  clip_aoi_config: configs/aoi/pyrenees_full.yaml

  # Global final output resolution for all sources
  resolution_m: 100

  stages: [download, clip, build]

sources:
  # ============================================================
  # COPERNICUS — PRIORITY EASY LAYERS
  # ============================================================

  - id: copernicus_clms_forest
    config: configs/sources/copernicus/copernicus_clms_forest.yaml
    stages: [download, clip, build]

  - id: copernicus_clms_grasslands
    config: configs/sources/copernicus/copernicus_clms_grasslands.yaml
    stages: [download, clip, build]

  - id: copernicus_clms_water_wetness
    config: configs/sources/copernicus/copernicus_clms_water_wetness.yaml
    stages: [download, clip, build]

  - id: copernicus_clms_corine_land_cover
    config: configs/sources/copernicus/copernicus_clms_corine_land_cover.yaml
    stages: [download, clip, build]

  - id: copernicus_dem_glo30
    config: configs/sources/copernicus/copernicus_dem_glo30.yaml
    stages: [download, clip, build]

  # ============================================================
  # COPERNICUS — INTERESTING EASY LAYERS
  # ============================================================

  - id: copernicus_clms_imperviousness
    config: configs/sources/copernicus/copernicus_clms_imperviousness.yaml
    stages: [download, clip, build]

  - id: copernicus_clms_small_landscape_features
    config: configs/sources/copernicus/copernicus_clms_small_landscape_features.yaml
    stages: [download, clip, build]

  # ============================================================
  # WORLDCLIM — CURRENT CLIMATE NORMALS
  # ============================================================
  # Expected variables depending on your YAML:
  # tmin, tmax, tavg, prec, srad, wind, vapr
  #
  # These are useful as baseline climate predictors:
  # - mean/min/max temperature
  # - precipitation
  # - solar radiation
  # - wind
  # - vapour pressure

  - id: worldclim_v2_1_climate_normals
    config: configs/sources/worldclim/worldclim_v2_1_climate_normals.yaml
    stages: [download, clip, build]

  # ============================================================
  # WORLDCLIM — ELEVATION
  # ============================================================
  # Kept even if Copernicus DEM is also included, because it allows
  # comparing the WorldClim elevation source with Copernicus DEM.

  - id: worldclim_v2_1_elevation
    config: configs/sources/worldclim/worldclim_v2_1_elevation.yaml
    stages: [download, clip, build]

  # ============================================================
  # WORLDCLIM — BIOCLIMATIC VARIABLES / DERIVED CLIMATE FEATURES
  # ============================================================
  # This is the most direct way to include derived climate features:
  #
  # BIO1  = Annual Mean Temperature
  # BIO2  = Mean Diurnal Range
  # BIO3  = Isothermality
  # BIO4  = Temperature Seasonality
  # BIO5  = Max Temperature of Warmest Month
  # BIO6  = Min Temperature of Coldest Month
  # BIO7  = Temperature Annual Range
  # BIO8  = Mean Temperature of Wettest Quarter
  # BIO9  = Mean Temperature of Driest Quarter
  # BIO10 = Mean Temperature of Warmest Quarter
  # BIO11 = Mean Temperature of Coldest Quarter
  # BIO12 = Annual Precipitation
  # BIO13 = Precipitation of Wettest Month
  # BIO14 = Precipitation of Driest Month
  # BIO15 = Precipitation Seasonality
  # BIO16 = Precipitation of Wettest Quarter
  # BIO17 = Precipitation of Driest Quarter
  # BIO18 = Precipitation of Warmest Quarter
  # BIO19 = Precipitation of Coldest Quarter

  - id: worldclim_v2_1_bioclim
    config: configs/sources/worldclim/worldclim_v2_1_bioclim.yaml
    stages: [download, clip, build]

  # ============================================================
  # WORLDCLIM — HISTORICAL MONTHLY / CRU-TS
  # ============================================================
  # Optional. Keep this block only if this YAML exists in your repo.
  # Useful for demonstrating historical climate time-series integration.
  #
  # If the source config is heavy, you can comment it out for a lighter run.

  - id: worldclim_cruts4_09_monthly
    config: configs/sources/worldclim/worldclim_cruts4_09_monthly.yaml
    stages: [download, clip, build]

  # ============================================================
  # WORLDCLIM — CMIP6 FUTURE CLIMATE
  # ============================================================
  # Optional. Keep this block only if this YAML exists in your repo.
  # Useful for demonstrating climate-change scenario integration.
  #
  # Example variables may include future tmin/tmax/prec under a selected
  # GCM, SSP and period.

  - id: worldclim_cmip6_future
    config: configs/sources/worldclim/worldclim_cmip6_future.yaml
    stages: [download, clip, build]

outputs:
  dataset_dir: data_processed/datasets/pyrenees_full_copernicus_worldclim_100m
  copy_rasters: true
  overwrite_existing: true
  write_run_summary: true
  write_manifest: true