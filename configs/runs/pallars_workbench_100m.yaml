run:
  name: pallars_workbench_100m
  description: Workbench-generated Pirineus Raster dataset.
  project_config: configs/project.yaml
  crs: EPSG:3035
  aoi_config: configs/aoi/experimental_pallars_sobira.yaml
  resolution_m: 100
  stages:
  - all
sources:
- id: esa_cci_biomass_agb_100m
  config: configs/sources/esa_cci/esa_cci_biomass_agb_100m.yaml
  select:
    variables:
    - agb
    - agb_sd
    dimensions:
      years:
      - 2005
      - 2006
      - 2007
      - 2008
      - 2009
      - 2010
      - 2011
      - 2012
      - 2015
      - 2016
      - 2017
      - 2018
      - 2019
      - 2020
      - 2021
      - 2022
      - 2023
      - 2024
    temporal:
      output_mode: aggregate
      aggregations:
        use: []
        custom:
        - name: custom_year_mean
          form: year_range_metric
          variables:
          - agb
          years:
          - 2005
          - 2024
          metric: mean
- id: ghsl_ghs_pop_r2023a
  config: configs/sources/ghsl/ghsl_ghs_pop_r2023a.yaml
  select:
    variables:
    - population_count
    dimensions:
      years:
      - 1975
      - 1980
      - 1985
      - 1990
      - 1995
      - 2000
      - 2005
      - 2010
      - 2015
      - 2020
      - 2025
      - 2030
    temporal:
      output_mode: aggregate
      aggregations:
        use: []
        custom:
        - name: custom_year_mean
          form: year_range_metric
          variables:
          - population_count
          years:
          - 1975
          - 2030
          metric: mean
- id: openstreetmap_geofabrik_pyrenees
  config: configs/sources/openstreetmap/openstreetmap_geofabrik_pyrenees.yaml
  select:
    layers:
    - transport.secondary_roads_distance
    - settlements.settlements_distance
    - transport.forest_tracks_distance
derived_features:
- name: agb_mean
  operation: focal
  method: mean
  description: Mean derived from esa cci biomass agb 100m · agb · custom_year_mean.
  unit: Mg/ha
  value_semantics: intensive
  output_dtype: float32
  parameters:
    radius: 1
  inputs:
    x:
      source_id: esa_cci_biomass_agb_100m
      variable: agb
      aggregation_name: custom_year_mean
outputs:
  dataset_dir: data_processed/datasets/pallars_workbench_100m
  copy_rasters: true
  overwrite_existing: true
  write_run_summary: true
  write_manifest: true
