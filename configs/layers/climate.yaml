source:
  name: worldclim_v2_1
  raw_dir: data_raw/worldclim

processing:
  target_resolution_m: 100
  preserve_native_resolution: false

variables:
  tmin:
    zip_file: wc2.1_30s_tmin.zip
    unit: celsius
    scale_factor: 0.1

  tmax:
    zip_file: wc2.1_30s_tmax.zip
    unit: celsius
    scale_factor: 0.1

  tavg:
    zip_file: wc2.1_30s_tavg.zip
    unit: celsius
    scale_factor: 0.1

  prec:
    zip_file: wc2.1_30s_prec.zip
    unit: mm
    scale_factor: 1.0

aggregation:
  months: [5, 6, 7, 8, 9]
  period_name: may-sep

derived_layers:
  isothermality:
    category: climate
    variable: isothermality
    metric: null
    period: may-sep

  temp_seasonality:
    category: climate
    variable: temp_seasonality
    metric: null
    period: may-sep

  precip_sum:
    category: climate
    variable: precip
    metric: sum
    period: may-sep

resampling:
  continuous: bilinear