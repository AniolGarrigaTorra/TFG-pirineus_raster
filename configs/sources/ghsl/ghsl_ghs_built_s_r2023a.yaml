source:
  id: ghsl_ghs_built_s_r2023a
  provider: ghsl
  product: ghs_built_s_r2023a
  product_group: human
  version: R2023A
  title: "GHSL GHS-BUILT-S R2023A"
  description: "Global Human Settlement Layer built-up surface grid."
  summary: "Built-up surface area from the European Commission JRC GHSL R2023A product."
  long_description: >-
    GHS-BUILT-S provides multitemporal global grids of built-up surface area.
    The values are extensive surface totals per source cell, so Pirineus Raster
    defaults to conservative-sum resampling when aligning the selected epochs to
    the target grid. The source also exposes the non-residential built-up
    surface layer where available.
  page_url: "https://ghsl.jrc.ec.europa.eu/ghs_buS2023.php"
  documentation_url: "https://ghsl.jrc.ec.europa.eu/documents/GHSL_Data_Package_2023.pdf"
  source_crs: ESRI:54009
  source_period: "1975-2030"
  citation: "Pesaresi, M. et al. GHS-BUILT-S R2023A - GHS built-up surface grid multitemporal (1975-2030). European Commission, Joint Research Centre."

dataset:
  layer_structure: yearly_static_collection
  file_format: geotiff
  data_type: count

domains:
  clip_aoi_config: configs/aoi/pyrenees_full.yaml
  output_aoi_config: configs/aoi/experimental_pallars_sobira.yaml

years: [1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020, 2025, 2030]

download:
  enabled: true
  mode: manual_url
  overwrite_existing: false

processing:
  source_resolution: 100m
  source_resolutions: [100m, 1000m, 3arcs, 30arcs]
  source_resolution_tokens:
    100m: "54009_100"
    1000m: "54009_1000"
    3arcs: "4326_3ss"
    30arcs: "4326_30ss"
  source_crs_by_resolution:
    100m: ESRI:54009
    1000m: ESRI:54009
    3arcs: EPSG:4326
    30arcs: EPSG:4326
  native_resolution_m_by_resolution:
    100m: 100
    1000m: 1000
  native_resolution_by_resolution:
    100m: 100m
    1000m: 1000m
    3arcs: 3arcs
    30arcs: 30arcs
  target_resolution_m: 100
  grid_from_project: true

resampling:
  default: conservative_sum

variable_groups:
  built_surface:
    template:
      name: "built_surface_{year}"
      enabled: true
      description: "Built-up surface area, {year}"
      unit: m2 per cell
      scale_factor: 1.0
      valid_range: [0, 100000000]
      data_type: count
      value_semantics: extensive
      source_filename: "GHS_BUILT_S_E{year}_GLOBE_R2023A_{source_resolution}_pyrenees.tif"
      urls:
        - "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_S_GLOBE_R2023A/GHS_BUILT_S_E{year}_GLOBE_R2023A_{source_resolution_token}/V1-0/tiles/GHS_BUILT_S_E{year}_GLOBE_R2023A_{source_resolution_token}_V1_0_R4_C18.zip"
        - "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_S_GLOBE_R2023A/GHS_BUILT_S_E{year}_GLOBE_R2023A_{source_resolution_token}/V1-0/tiles/GHS_BUILT_S_E{year}_GLOBE_R2023A_{source_resolution_token}_V1_0_R4_C19.zip"
        - "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_S_GLOBE_R2023A/GHS_BUILT_S_E{year}_GLOBE_R2023A_{source_resolution_token}/V1-0/tiles/GHS_BUILT_S_E{year}_GLOBE_R2023A_{source_resolution_token}_V1_0_R5_C18.zip"
        - "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_S_GLOBE_R2023A/GHS_BUILT_S_E{year}_GLOBE_R2023A_{source_resolution_token}/V1-0/tiles/GHS_BUILT_S_E{year}_GLOBE_R2023A_{source_resolution_token}_V1_0_R5_C19.zip"
      zip_member_pattern: ".*GHS_BUILT_S_E{year}_GLOBE_R2023A_{source_resolution_token}_V1_0.*\\.tif$"
      allow_multiple_zip_members: true
      postprocess: mosaic_zip_geotiff
      temporal:
        type: static
        reference_year: "{year}"
    foreach:
      - {year: 1975}
      - {year: 1980}
      - {year: 1985}
      - {year: 1990}
      - {year: 1995}
      - {year: 2000}
      - {year: 2005}
      - {year: 2010}
      - {year: 2015}
      - {year: 2020}
      - {year: 2025}
      - {year: 2030}

  built_surface_non_residential:
    template:
      name: "built_surface_non_residential_{year}"
      enabled: true
      description: "Non-residential built-up surface area, {year}"
      unit: m2 per cell
      scale_factor: 1.0
      valid_range: [0, 100000000]
      data_type: count
      value_semantics: extensive
      source_filename: "GHS_BUILT_S_NRES_E{year}_GLOBE_R2023A_{source_resolution}_pyrenees.tif"
      urls:
        - "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_S_GLOBE_R2023A/GHS_BUILT_S_NRES_E{year}_GLOBE_R2023A_{source_resolution_token}/V1-0/tiles/GHS_BUILT_S_NRES_E{year}_GLOBE_R2023A_{source_resolution_token}_V1_0_R4_C18.zip"
        - "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_S_GLOBE_R2023A/GHS_BUILT_S_NRES_E{year}_GLOBE_R2023A_{source_resolution_token}/V1-0/tiles/GHS_BUILT_S_NRES_E{year}_GLOBE_R2023A_{source_resolution_token}_V1_0_R4_C19.zip"
        - "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_S_GLOBE_R2023A/GHS_BUILT_S_NRES_E{year}_GLOBE_R2023A_{source_resolution_token}/V1-0/tiles/GHS_BUILT_S_NRES_E{year}_GLOBE_R2023A_{source_resolution_token}_V1_0_R5_C18.zip"
        - "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_S_GLOBE_R2023A/GHS_BUILT_S_NRES_E{year}_GLOBE_R2023A_{source_resolution_token}/V1-0/tiles/GHS_BUILT_S_NRES_E{year}_GLOBE_R2023A_{source_resolution_token}_V1_0_R5_C19.zip"
      zip_member_pattern: ".*GHS_BUILT_S_NRES_E{year}_GLOBE_R2023A_{source_resolution_token}_V1_0.*\\.tif$"
      allow_multiple_zip_members: true
      postprocess: mosaic_zip_geotiff
      temporal:
        type: static
        reference_year: "{year}"
    foreach:
      - {year: 1975}
      - {year: 1980}
      - {year: 1985}
      - {year: 1990}
      - {year: 1995}
      - {year: 2000}
      - {year: 2005}
      - {year: 2010}
      - {year: 2015}
      - {year: 2020}
      - {year: 2025}
      - {year: 2030}

output:
  write_geotiff: true
  write_sidecar_json: true
  compression: LZW
  dtype: float32

validation:
  fail_on_out_of_range: false
