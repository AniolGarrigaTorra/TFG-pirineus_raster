source:
  id: ghsl_ghs_smod_r2023a
  provider: ghsl
  product: ghs_smod_r2023a
  product_group: human
  version: R2023A
  title: "GHSL GHS-SMOD R2023A"
  description: "Global Human Settlement Layer settlement model grid."
  summary: "Degree of urbanisation / settlement model classes from GHSL R2023A."
  long_description: >-
    GHS-SMOD classifies grid cells into settlement typologies using population
    and built-up information. It is useful for modelling human pressure,
    settlement context and urban-rural gradients. Pirineus Raster exposes the
    official 1 km projected and 30 arc-second geographic grids as selectable
    native resolutions before clipping and aligning to the project grid.
  page_url: "https://ghsl.jrc.ec.europa.eu/ghs_smod2023.php"
  documentation_url: "https://ghsl.jrc.ec.europa.eu/documents/GHSL_Data_Package_2023.pdf"
  source_crs: ESRI:54009
  source_period: "1975-2030"
  citation: "Florczyk, A. et al. GHS-SMOD R2023A - GHS settlement model grid multitemporal (1975-2030). European Commission, Joint Research Centre."

dataset:
  layer_structure: yearly_static_collection
  file_format: geotiff
  data_type: categorical

domains:
  clip_aoi_config: configs/aoi/pyrenees_full.yaml
  output_aoi_config: configs/aoi/experimental_pallars_sobira.yaml

years: [1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020, 2025, 2030]

download:
  enabled: true
  mode: manual_url
  overwrite_existing: false

processing:
  source_resolution: 1000m
  source_resolutions: [1000m, 30arcs]
  source_resolution_tokens:
    1000m: "54009_1000"
    30arcs: "4326_30ss"
  source_crs_by_resolution:
    1000m: ESRI:54009
    30arcs: EPSG:4326
  native_resolution_m_by_resolution:
    1000m: 1000
  native_resolution_by_resolution:
    1000m: 1000m
    30arcs: 30arcs
  target_resolution_m: 100
  grid_from_project: true

resampling:
  default: nearest

variable_groups:
  settlement_model:
    template:
      name: "settlement_model_{year}"
      enabled: true
      description: "GHSL settlement model class, {year}"
      unit: class
      scale_factor: 1.0
      valid_range: [0, 30]
      data_type: categorical
      value_semantics: categorical
      round_values: true
      source_filename: "GHS_SMOD_E{year}_GLOBE_R2023A_{source_resolution}_pyrenees.tif"
      urls:
        - "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_SMOD_GLOBE_R2023A/GHS_SMOD_E{year}_GLOBE_R2023A_{source_resolution_token}/V1-0/tiles/GHS_SMOD_E{year}_GLOBE_R2023A_{source_resolution_token}_V1_0_R4_C18.zip"
        - "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_SMOD_GLOBE_R2023A/GHS_SMOD_E{year}_GLOBE_R2023A_{source_resolution_token}/V1-0/tiles/GHS_SMOD_E{year}_GLOBE_R2023A_{source_resolution_token}_V1_0_R4_C19.zip"
        - "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_SMOD_GLOBE_R2023A/GHS_SMOD_E{year}_GLOBE_R2023A_{source_resolution_token}/V1-0/tiles/GHS_SMOD_E{year}_GLOBE_R2023A_{source_resolution_token}_V1_0_R5_C18.zip"
        - "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_SMOD_GLOBE_R2023A/GHS_SMOD_E{year}_GLOBE_R2023A_{source_resolution_token}/V1-0/tiles/GHS_SMOD_E{year}_GLOBE_R2023A_{source_resolution_token}_V1_0_R5_C19.zip"
      zip_member_pattern: ".*GHS_SMOD_E{year}_GLOBE_R2023A_{source_resolution_token}_V1_0.*\\.tif$"
      allow_multiple_zip_members: true
      postprocess: mosaic_zip_geotiff
      category_classes:
        - value: 10
          name: water
          label: "Water"
        - value: 11
          name: very_low_density_rural
          label: "Very low density rural"
        - value: 12
          name: low_density_rural
          label: "Low density rural"
        - value: 13
          name: rural_cluster
          label: "Rural cluster"
        - value: 21
          name: suburban_or_peri_urban
          label: "Suburban or peri-urban"
        - value: 22
          name: semi_dense_urban_cluster
          label: "Semi-dense urban cluster"
        - value: 23
          name: dense_urban_cluster
          label: "Dense urban cluster"
        - value: 30
          name: urban_centre
          label: "Urban centre"
        - values: [21, 22, 23, 30]
          name: urban_and_suburban
          label: "Urban, suburban and peri-urban classes"
        - values: [22, 23, 30]
          name: urban_cluster_or_centre
          label: "Urban clusters and centres"
        - values: [11, 12, 13]
          name: rural
          label: "Rural classes"
      temporal:
        type: static
        reference_year: "{year}"
    foreach:
      - {year: 1975}
      - {year: 1980}
      - {year: 1985}
      - {year: 1990}
      - {year: 1995}
      - {year: 2000}
      - {year: 2005}
      - {year: 2010}
      - {year: 2015}
      - {year: 2020}
      - {year: 2025}
      - {year: 2030}

output:
  write_geotiff: true
  write_sidecar_json: true
  compression: LZW
  dtype: float32

validation:
  fail_on_out_of_range: false
