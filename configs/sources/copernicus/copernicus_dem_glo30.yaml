processing:
  source_resolution: 30m
  target_resolution_m: 100
  grid_from_project: true

resampling:
  default: average
  by_variable:
    elevation: average

variables:
  elevation:
    enabled: true
    description: "Copernicus DEM GLO-30 elevation / surface height"
    unit: m
    scale_factor: 1.0
    valid_range: [-500, 9000]
    data_type: continuous
    native_resolution_m: 30
    temporal:
      type: static
      reference_year: 2015

output:
  write_geotiff: true
  write_sidecar_json: true
  compression: LZW
  dtype: float32

validation:
  fail_on_out_of_range: false
  max_out_of_range_fraction: 0.001