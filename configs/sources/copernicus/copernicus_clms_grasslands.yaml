source:
  id: copernicus_clms_grasslands
  provider: copernicus
  product: clms_grasslands
  product_group: land_cover
  version: "2021"
  title: "Copernicus HRL Grasslands"
  description: "Copernicus Land Monitoring Service High Resolution Layer Grasslands"
  summary: "Yearly European grassland status layers available at 10 m and 100 m source resolutions."
  long_description: >-
    The Copernicus High Resolution Layer Grasslands product maps grassland
    status across Europe using Sentinel-1 and Sentinel-2 inputs. The source is
    useful for habitat, land-cover and agricultural context and offers both
    10 m and 100 m native product resolutions where configured.
  page_url: "https://land.copernicus.eu/en/products/high-resolution-layer-grasslands"
  source_crs: EPSG:3035
  source_period: "2021"
  citation: "Copernicus Land Monitoring Service. High Resolution Layer Grasslands."

dataset:
  layer_structure: static_single
  file_format: geotiff
  native_resolution_m: 10
  data_type: categorical

domains:
  clip_aoi_config: configs/aoi/pyrenees_full.yaml

download:
  enabled: true
  mode: wekeo_hda
  overwrite_existing: false

  hda:
    max_workers: 2
    max_results: 50
    temporary_dir: data_raw/copernicus/_hda_downloads
    move_downloaded_to_raw: false
    mosaic_compression: LZW
    sleep_after_download_seconds: 2

  files:
    grasslands:
      filename: grasslands_2021_10m_pyrenees_full_mosaic.tif
      max_results: 50
      file_pattern: "*.zip"
      zip_member_pattern: ".*\\.tif$"
      postprocess: mosaic_zip_geotiff
      hda_query:
        dataset_id: "EO:EEA:DAT:HRL:GRA"
        bbox:
          - -2.28618323
          - 41.9550235
          - 3.18030846
          - 43.47467682
        productType: "Grassland"
        resolution: "10m"
        year: "2021"
        itemsPerPage: 200
        startIndex: 0

processing:
  source_resolution: 10m
  target_resolution_m: 100
  grid_from_project: true

resampling:
  default: nearest
  by_variable:
    grasslands: nearest

variables:
  grasslands:
    enabled: true
    description: "Grasslands"
    unit: class
    scale_factor: 1.0
    valid_range: [0, 255]
    data_type: categorical
    value_semantics: categorical
    native_resolution_m: 10
    round_values: true
    category_classes:
      - value: 1
        name: grassland
        label: "Grassland"
    temporal:
      type: static
      reference_year: 2021

output:
  write_geotiff: true
  write_sidecar_json: true
  compression: LZW
  dtype: float32

validation:
  fail_on_out_of_range: false
  max_out_of_range_fraction: 0.001
