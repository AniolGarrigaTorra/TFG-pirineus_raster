source:
  id: copernicus_clms_corine_land_cover
  provider: copernicus
  product: clms_corine_land_cover
  product_group: land_cover
  version: "2018"
  description: "Copernicus Land Monitoring Service CORINE Land Cover"
  page_url: "https://land.copernicus.eu/en/products/corine-land-cover"
  source_crs: EPSG:3035
  source_period: "2018"
  citation: "Copernicus Land Monitoring Service. CORINE Land Cover 2018."

dataset:
  layer_structure: static_single
  file_format: zip_geotiff
  native_resolution_m: 100
  data_type: categorical

domains:
  clip_aoi_config: configs/aoi/pyrenees_full.yaml
  output_aoi_config: configs/aoi/experimental_pallars_sobira.yaml

download:
  enabled: true
  mode: wekeo_hda
  overwrite_existing: false

  hda:
    max_workers: 2
    max_results: 20
    temporary_dir: data_raw/copernicus/_hda_downloads
    move_downloaded_to_raw: false
    sleep_after_download_seconds: 2

  files:
    corine_land_cover:
      filename: corine_land_cover_2018_100m.zip
      max_results: 20
      file_pattern: "*.zip"
      zip_member_pattern: ".*/DATA/U2018_CLC2018_V2020_20u1\\.tif$"
      postprocess: copy_single
      hda_query:
        dataset_id: "EO:EEA:DAT:CORINE"
        format: "GeoTiff100mt"
        productType: "Corine Land Cover 2018"
        itemsPerPage: 200
        startIndex: 0

processing:
  source_resolution: 100m
  target_resolution_m: 100
  grid_from_project: true

resampling:
  default: nearest
  by_variable:
    corine_land_cover: nearest

variables:
  corine_land_cover:
    enabled: true
    description: "CORINE Land Cover"
    unit: class
    scale_factor: 1.0
    valid_range: [0, 255]
    data_type: categorical
    native_resolution_m: 100
    round_values: true
    temporal:
      type: static
      reference_year: 2018

output:
  write_geotiff: true
  write_sidecar_json: true
  compression: LZW
  dtype: float32

validation:
  fail_on_out_of_range: false
  max_out_of_range_fraction: 0.001