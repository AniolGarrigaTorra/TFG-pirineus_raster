source:
  id: copernicus_hrsi_snow
  provider: copernicus
  product: hrsi_snow
  product_group: snow
  version: "2022"
  title: "Copernicus HRSI Fractional Snow Cover"
  description: "Copernicus High Resolution Snow and Ice Fractional Snow Cover daily observations"
  summary: "Daily 20 m Fractional Snow Cover observations for Europe, aggregated during download according to the run config."
  long_description: >-
    The Copernicus High Resolution Snow and Ice Fractional Snow Cover product
    is derived from Sentinel-2 observations and represents snow fraction at
    high spatial resolution. Pirineus Raster uses it as a temporal source whose
    daily observations can be post-processed into user-selected snow-cover
    metrics during the download stage.
  page_url: "https://land.copernicus.eu/en/products/snow/fractional-snow-cover"
  source_crs: EPSG:3035
  source_period: "2022"
  citation: "Copernicus Land Monitoring Service. High Resolution Snow and Ice, Fractional Snow Cover."

dataset:
  layer_structure: temporal_aggregation
  file_format: geotiff
  native_resolution_m: 20
  data_type: percentage

domains:
  clip_aoi_config: configs/aoi/pyrenees_full.yaml

download:
  enabled: true
  mode: wekeo_hda
  overwrite_existing: false

  hda:
    max_workers: 2
    max_results: 50
    temporary_dir: data_raw/copernicus/_hda_downloads
    move_downloaded_to_raw: false
    sleep_after_download_seconds: 2

  files:
    snow_scenes:
      filename: snow_scenes_marker.txt
      max_results: 50
      file_pattern: "*.zip"
      postprocess: temporal_zip_geotiff_aggregation
      hda_query:
        dataset_id: "EO:CRYO:DAT:HRSI:FSC"
        startdate: "2022-01-01T00:00:00.000Z"
        enddate: "2022-03-31T23:59:59.999Z"
        cloudCover: "70"
        published_start: "2022-01-01T00:00:00.000Z"
        published_end: "2026-12-31T00:00:00.000Z"
        bbox:
          - -2.28618323
          - 41.9550235
          - 3.18030846
          - 43.47467682
        itemsPerPage: 200
        startIndex: 0

processing:
  source_resolution: 20m
  target_resolution_m: 100
  grid_from_project: true

resampling:
  default: average

variables:
  snow_fraction:
    enabled: true
    description: "Daily fractional snow cover on ground."
    unit: percent
    scale_factor: 1.0
    valid_range: [0, 100]
    data_type: percentage
    value_semantics: percentage
    native_resolution_m: 20
    temporal:
      type: daily_observation_series
      temporal_axis: date

temporal_postprocess:
  zip_member_pattern: ".*FSCOG.*\\.tif$"
  date_regex: "(\\d{8})"
  date_format: "%Y%m%d"
  available_years: [2022, 2022]
  default_years: [2022, 2022]
  default_months: [1, 3]
  supported_methods: [mean, std, min, max, count_threshold, valid_observation_count]
  hda_max_results_per_day_estimate: 8

  target_crs: EPSG:3035
  target_resolution_m: 20
  vrt_resampling: nearest

  # Important: this forces the temporal raw outputs to the Pyrenees full AOI,
  # instead of using the much larger union of all Sentinel-2 tile extents.
  reference_grid:
    crs: EPSG:3035
    resolution_m: 20
    bounds:
      xmin: 3300000
      xmax: 3770000
      ymin: 2120000
      ymax: 2345000

  # Block size for streaming aggregation. Lower this if memory is tight.
  block_size: 512

  value_filter:
    valid_range: [0, 100]
    nodata_values: [205, 210, 254, 255]
    scale_factor: 1.0

  export_timesteps:
    enabled: false
    output_dir: timesteps
    naming: "{variable}_{date}.tif"
    variable_name_pattern: "snow_fraction_{date}"
    unit: percent
    data_type: percentage
    value_semantics: percentage
    native_resolution_m: 20

  aggregation_presets:
    - name: snow_fraction_mean_winter
      method: mean
      months: [12, 1, 2, 3]
      years: [2022, 2022]
      description: "Mean fractional snow cover on ground during winter period December-March."
      unit: percent
      valid_range: [0, 100]
      data_type: percentage
      value_semantics: percentage
      native_resolution_m: 20

    - name: snow_fraction_mean_spring
      method: mean
      months: [4, 5, 6]
      years: [2022, 2022]
      description: "Mean fractional snow cover on ground during spring period April-June."
      unit: percent
      valid_range: [0, 100]
      data_type: percentage
      value_semantics: percentage
      native_resolution_m: 20

    - name: snow_fraction_mean_annual
      method: mean
      months: [1, 12]
      years: [2022, 2022]
      description: "Mean fractional snow cover on ground during the selected year."
      unit: percent
      valid_range: [0, 100]
      data_type: percentage
      value_semantics: percentage
      native_resolution_m: 20

    - name: snow_cover_days_winter
      method: count_threshold
      threshold: 50
      comparison: ">="
      months: [12, 1, 2, 3]
      years: [2022, 2022]
      description: "Number of valid observation days with fractional snow cover >= 50% during winter period December-March."
      unit: days
      valid_range: [0, 250]
      data_type: continuous
      value_semantics: count
      native_resolution_m: 20

    - name: snow_cover_days_spring
      method: count_threshold
      threshold: 50
      comparison: ">="
      months: [4, 5, 6]
      years: [2022, 2022]
      description: "Number of valid observation days with fractional snow cover >= 50% during spring period April-June."
      unit: days
      valid_range: [0, 250]
      data_type: continuous
      value_semantics: count
      native_resolution_m: 20

    - name: snow_valid_observations_annual
      method: valid_observation_count
      months: [1, 12]
      years: [2022, 2022]
      description: "Number of valid fractional snow cover observations during the selected year."
      unit: observations
      valid_range: [0, 365]
      data_type: continuous
      value_semantics: count
      native_resolution_m: 20

output:
  write_geotiff: true
  write_sidecar_json: true
  compression: LZW
  dtype: float32

validation:
  fail_on_out_of_range: false
  max_out_of_range_fraction: 0.001
