source:
  id: copernicus_clms_small_landscape_features
  provider: copernicus
  product: clms_small_landscape_features
  product_group: land_cover
  version: "2021"
  description: "Copernicus Land Monitoring Service High Resolution Layer Small Landscape Features / Small Woody Features"
  page_url: "https://land.copernicus.eu/en/products/high-resolution-layer-small-landscape-features"
  source_crs: EPSG:3035
  source_period: "2021"
  citation: "Copernicus Land Monitoring Service. High Resolution Layer Small Landscape Features."

dataset:
  layer_structure: static_single
  file_format: zip_geotiff
  native_resolution_m: 100
  data_type: continuous

domains:
  clip_aoi_config: configs/aoi/pyrenees_full.yaml
  output_aoi_config: configs/aoi/experimental_pallars_sobira.yaml

download:
  enabled: true
  mode: wekeo_hda
  overwrite_existing: false

  hda:
    max_workers: 2
    max_results: 50
    temporary_dir: data_raw/copernicus/_hda_downloads
    move_downloaded_to_raw: false
    sleep_after_download_seconds: 2

  files:
    small_landscape_features:
      filename: small_landscape_features_2021_100m_eu_03035.zip
      max_results: 50
      file_pattern: "*eu_03035*.zip"
      zip_member_pattern: ".*\\.tif$"
      postprocess: copy_single
      hda_query:
        dataset_id: "EO:EEA:DAT:HRL:SLF"
        productType: "Small Woody Features"
        resolution: "100m"
        year: "2021"
        itemsPerPage: 200
        startIndex: 0

processing:
  source_resolution: 100m
  target_resolution_m: 100
  grid_from_project: true

resampling:
  default: average
  by_variable:
    small_landscape_features: average

variables:
  small_landscape_features:
    enabled: true
    description: "Small Landscape Features / Small Woody Features"
    unit: percent
    scale_factor: 1.0
    valid_range: [0, 100]
    data_type: percentage
    native_resolution_m: 100
    temporal:
      type: static
      reference_year: 2021

output:
  write_geotiff: true
  write_sidecar_json: true
  compression: LZW
  dtype: float32

validation:
  fail_on_out_of_range: false
  max_out_of_range_fraction: 0.001