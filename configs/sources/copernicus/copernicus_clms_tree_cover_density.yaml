source:
  id: copernicus_clms_tree_cover_density
  provider: copernicus
  product: clms_tree_cover_density
  product_group: land_cover
  version: "2021"
  description: "Copernicus Land Monitoring Service High Resolution Layer Tree Cover Density"
  page_url: "https://land.copernicus.eu/en/products/high-resolution-layer-forests-and-tree-cover"
  source_crs: EPSG:3035
  source_period: "2021"
  citation: "Copernicus Land Monitoring Service. High Resolution Layer Tree Cover Density."

dataset:
  layer_structure: static_single
  file_format: zip_geotiff
  native_resolution_m: 10
  data_type: percentage

domains:
  clip_aoi_config: configs/aoi/pyrenees_full.yaml
  output_aoi_config: configs/aoi/experimental_pallars_sobira.yaml

download:
  enabled: true
  mode: wekeo_hda
  overwrite_existing: false

  hda:
    max_workers: 2
    max_results: 1
    temporary_dir: data_raw/copernicus/_hda_downloads
    move_downloaded_to_raw: false

  files:
    tree_cover_density:
      filename: tree_cover_density_2021_10m_E33N23.zip
      max_results: 1
      file_pattern: "*.zip"
      zip_member_pattern: ".*\\.tif$"
      hda_query:
        dataset_id: "EO:EEA:DAT:HRL:TCF"
        bbox:
          - -2.28618323
          - 41.9550235
          - 3.18030846
          - 43.47467682
        productType: "Tree Cover Density"
        resolution: "10m"
        year: "2021"
        itemsPerPage: 200
        startIndex: 0

processing:
  source_resolution: 10m
  target_resolution_m: 100
  grid_from_project: true

resampling:
  default: average
  by_variable:
    tree_cover_density: average

variables:
  tree_cover_density:
    enabled: true
    description: "Tree Cover Density"
    unit: percent
    scale_factor: 1.0
    valid_range: [0, 100]
    data_type: percentage
    native_resolution_m: 10
    temporal:
      type: static
      reference_year: 2021

output:
  write_geotiff: true
  write_sidecar_json: true
  compression: LZW
  dtype: float32

validation:
  fail_on_out_of_range: false
  max_out_of_range_fraction: 0.001