project_name: pirineus_raster

crs: EPSG:3035
nodata: -9999.0

paths:
  raw_dir: data_raw
  interim_dir: data_interim
  processed_dir: data_processed
  logs_dir: logs

grids:
  subdir: grids
  available_resolutions_m: [10, 30, 50, 100]
  default_resolution_m: 100

features:
  processed_subdir: features

datasets:
  processed_subdir: datasets
  rasters_subdir: rasters
  metadata_subdir: metadata
  config_subdir: config
  logs_subdir: logs

sources:
  raw_subdir: sources
  interim_subdir: sources

validation:
  output_dir: data_processed/validation

naming:
  resolution_unit: m
  month_format: two_digits

parallelization:
  download_max_workers: 2
  copy_max_workers: 4
  description: "Global defaults for parallel operations. Can be overridden per source."